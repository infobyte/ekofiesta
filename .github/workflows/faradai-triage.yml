name: FaradAI Triage

# Manual-only. Runs the FaradAI cloud agent in triage mode (WORKSPACE_CONTEXT)
# over the findings already present in the workspace — validates, dedupes and
# re-scores them. Independent of the pentest workflow.
on:
  workflow_dispatch:

jobs:
  faradai-triage:
    name: FaradAI Triage
    runs-on: ubuntu-latest
    env:
      FARADAY_URL: ${{ secrets.FARADAY_URL }}
      FARADAY_USER: ${{ secrets.FARADAY_USER }}
      FARADAY_PASSWORD: ${{ secrets.FARADAY_PASSWORD }}
      FARADAI_AGENT_ID: ${{ vars.FARADAI_AGENT_ID || '2' }}
      FARADAI_TARGET: ${{ vars.FARADAI_TARGET }}
      FARADAY_WORKSPACE: ekofiesta
    steps:
      - name: Launch FaradAI triage
        run: |
          set -euo pipefail
          BASE="${FARADAY_URL%/}"
          curl -sS -c /tmp/fcj.txt -X POST "$BASE/_api/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$FARADAY_USER\",\"password\":\"$FARADAY_PASSWORD\"}" >/dev/null
          TOKEN=$(curl -sS -b /tmp/fcj.txt "$BASE/_api/v3/token" | tr -d '"')
          echo "✓ Authenticated with Faraday"
          curl -sS -X POST "$BASE/_api/v3/cloud_agents/$FARADAI_AGENT_ID/run" \
            -H "Authorization: Token $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "args": {
                "TARGET": "'"${FARADAI_TARGET:-n/a}"'",
                "GOAL": "Produce a clean, trustworthy vulnerability set: every remaining finding is a confirmed, reproducible, correctly-scored true positive with no duplicates.",
                "INSTRUCTION": "Triage existing workspace findings: reproduce each, confirm real exploitable vulns, mark unreproducible/benign as false positives, merge duplicates, and re-score by demonstrated impact (not scanner defaults). Add brief evidence and remediation notes.",
                "MODE": "Dual",
                "ROUNDS": 20,
                "WORKSPACE_CONTEXT": true
              },
              "workspaces": ["'"$FARADAY_WORKSPACE"'"]
            }' -w "\nHTTP %{http_code}\n"
          echo "Monitor: $BASE/#/feed/ws/$FARADAY_WORKSPACE/host/all/vulns"
