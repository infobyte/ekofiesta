name: FaradAI Triage

# Manual-only. Runs the dedicated FaradAI Triage cloud agent (id 3, category
# "AI Triage") over the findings already present in the workspace: reproduces
# each finding, confirms true positives, auto-closes false positives, dedupes
# and re-scores (CVSS/CWE). Independent of the pentest workflow.
on:
  workflow_dispatch:

jobs:
  faradai-triage:
    name: FaradAI Triage
    runs-on: ubuntu-latest
    env:
      FARADAY_URL: ${{ secrets.FARADAY_URL }}
      FARADAY_USER: ${{ secrets.FARADAY_USER }}
      FARADAY_PASSWORD: ${{ secrets.FARADAY_PASSWORD }}
      # Dedicated triage cloud agent (id 3). Overridable via repo variable.
      FARADAI_TRIAGE_AGENT_ID: ${{ vars.FARADAI_TRIAGE_AGENT_ID || '3' }}
      FARADAY_WORKSPACE: ekofiesta
    steps:
      - name: Launch FaradAI triage
        run: |
          set -euo pipefail
          BASE="${FARADAY_URL%/}"
          curl -sS -c /tmp/fcj.txt -X POST "$BASE/_api/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$FARADAY_USER\",\"password\":\"$FARADAY_PASSWORD\"}" >/dev/null
          TOKEN=$(curl -sS -b /tmp/fcj.txt "$BASE/_api/v3/token" | tr -d '"')
          echo "✓ Authenticated with Faraday"
          curl -sS -X POST "$BASE/_api/v3/cloud_agents/$FARADAI_TRIAGE_AGENT_ID/run" \
            -H "Authorization: Token $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "args": {
                "WORKSPACES": "'"$FARADAY_WORKSPACE"'",
                "GOAL": "Clean, trustworthy vulnerability set: reproduce each finding, confirm true positives, auto-close false positives, dedupe, and assign accurate CVSS/CWE severity from demonstrated impact. Keep only real, exploitable issues.",
                "ROUNDS": 4,
                "REPRODUCE": true,
                "AUTO_CLOSE_FP": true,
                "SEVERITIES": "critical,high,medium,low,info",
                "LANGUAGE": "en"
              },
              "workspaces": ["'"$FARADAY_WORKSPACE"'"]
            }' -w "\nHTTP %{http_code}\n"
          echo "Monitor: $BASE/#/feed/ws/$FARADAY_WORKSPACE/host/all/vulns"
