name: DevSecOps Security Scan

# Scans no longer run on every push / pull request (famato, 2026-11):
#   - workflow_dispatch  run the full suite by hand whenever needed
#   - schedule           Mondays 04:00 UTC = 01:00 America/Argentina/Buenos_Aires,
#                        but only if the repo had commits in the last 7 days
#                        (the `gate` job short-circuits quiet weeks)
# Note: GitHub disables scheduled workflows after 60 days without repo activity.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

env:
  DEVSECOPS_WINDOW_HOURS: 168

jobs:
  gate:
    name: Weekly gate (commits in the last 7 days?)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check last commit age
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run -> scanning"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AGE_H=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 3600 ))
          echo "Last commit: $(git log -1 --format='%h %ci') — ${AGE_H}h ago (window: ${DEVSECOPS_WINDOW_HOURS}h)"
          if [ "$AGE_H" -lt "$DEVSECOPS_WINDOW_HOURS" ]; then
            echo "Recent commits found -> scanning"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits in the last ${DEVSECOPS_WINDOW_HOURS}h -> skipping this week"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  semgrep:
    name: Semgrep (SAST)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --json --output semgrep-results.json \
            --exclude node_modules --exclude dist --exclude .next || true
          echo "Findings: $(python3 -c "import json; print(len(json.load(open('semgrep-results.json')).get('results', [])))" 2>/dev/null || echo 'unknown')"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  npm-audit:
    name: npm Audit (SCA)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: npm audit
        run: npm audit --json > npm-audit-results.json || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: npm-audit-results.json

  gitleaks:
    name: Gitleaks (Secrets)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for orgs — run the
      # open-source CLI directly instead.
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo \
            --report-format json --report-path /repo/leaks.json \
            --exit-code 0
          echo "Leaks found: $(python3 -c "import json; print(len(json.load(open('leaks.json'))))" 2>/dev/null || echo 'unknown')"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: leaks.json

  trivy:
    name: Trivy-fs (Dependency Scan)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json

  sonarcloud:
    name: SonarCloud (Code Quality)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=faradaysec_ekofiesta
            -Dsonar.organization=faradaysec

  upload-to-faraday:
    name: Upload to Faraday
    needs: [ gate, semgrep, npm-audit, gitleaks, trivy, sonarcloud ]
    runs-on: ubuntu-latest
    if: always() && needs.gate.outputs.run == 'true'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Install faraday-cli
        # six: missing transitive dependency of faraday-cli 2.3.0 (import error without it)
        run: python3 -m pip install --quiet faraday-cli six
      - name: Upload to Faraday
        env:
          FARADAY_URL: ${{ secrets.FARADAY_URL }}
          FARADAY_USER: ${{ secrets.FARADAY_USER }}
          FARADAY_PASSWORD: ${{ secrets.FARADAY_PASSWORD }}
        run: |
          if [ -z "$FARADAY_URL" ] || [ -z "$FARADAY_USER" ] || [ -z "$FARADAY_PASSWORD" ]; then
            echo "⚠ Faraday credentials not configured. Skipping upload."
            exit 0
          fi

          faraday-cli auth -f "$FARADAY_URL" -u "$FARADAY_USER" -p "$FARADAY_PASSWORD"
          faraday-cli workspace create ekofiesta 2>/dev/null || true
          faraday-cli workspace select ekofiesta 2>/dev/null || true

          echo "📤 Uploading security scan results to Faraday"

          # Upload all JSON/XML reports from downloaded artifacts only
          find reports -type f \( -name "*.json" -o -name "*.xml" \) -print0 | \
          while IFS= read -r -d '' report; do
            if [ -f "$report" ]; then
              echo "  • $(basename "$report")"
              faraday-cli tool report "$report" --vuln-tag "${{ github.ref_name }}" || echo "    ⚠ Upload failed for $report"
            fi
          done

          echo "✅ All scans uploaded to Faraday"
          echo "View at: https://manaos.apps.faradaysec.com/#/feed/ws/ekofiesta/host/all/vulns"
