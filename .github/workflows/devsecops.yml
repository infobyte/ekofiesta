name: DevSecOps Security Scan

on:
  push:
    branches: [ main, develop, '**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --json --output semgrep-results.json \
            --exclude node_modules --exclude dist --exclude .next || true
          echo "Findings: $(python3 -c "import json; print(len(json.load(open('semgrep-results.json')).get('results', [])))" 2>/dev/null || echo 'unknown')"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  npm-audit:
    name: npm Audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: npm audit
        run: npm audit --json > npm-audit-results.json || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: npm-audit-results.json

  gitleaks:
    name: Gitleaks (Secrets)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for orgs — run the
      # open-source CLI directly instead.
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo \
            --report-format json --report-path /repo/leaks.json \
            --exit-code 0
          echo "Leaks found: $(python3 -c "import json; print(len(json.load(open('leaks.json'))))" 2>/dev/null || echo 'unknown')"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: leaks.json

  trivy:
    name: Trivy-fs (Dependency Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json

  sonarcloud:
    name: SonarCloud (Code Quality)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=faradaysec_ekofiesta
            -Dsonar.organization=faradaysec

  upload-to-faraday:
    name: Upload to Faraday
    needs: [ semgrep, npm-audit, gitleaks, trivy, sonarcloud ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Install faraday-cli
        run: python3 -m pip install --quiet faraday-cli
      - name: Upload to Faraday
        env:
          FARADAY_URL: ${{ secrets.FARADAY_URL }}
          FARADAY_USER: ${{ secrets.FARADAY_USER }}
          FARADAY_PASSWORD: ${{ secrets.FARADAY_PASSWORD }}
        run: |
          if [ -z "$FARADAY_URL" ] || [ -z "$FARADAY_USER" ] || [ -z "$FARADAY_PASSWORD" ]; then
            echo "⚠ Faraday credentials not configured. Skipping upload."
            exit 0
          fi

          faraday-cli auth -f "$FARADAY_URL" -u "$FARADAY_USER" -p "$FARADAY_PASSWORD"
          faraday-cli workspace create ekofiesta 2>/dev/null || true
          faraday-cli workspace select ekofiesta 2>/dev/null || true

          echo "📤 Uploading security scan results to Faraday"

          # Upload all JSON/XML reports from downloaded artifacts only
          find reports -type f \( -name "*.json" -o -name "*.xml" \) -print0 | \
          while IFS= read -r -d '' report; do
            if [ -f "$report" ]; then
              echo "  • $(basename "$report")"
              faraday-cli tool report "$report" --vuln-tag "${{ github.ref_name }}" || echo "    ⚠ Upload failed for $report"
            fi
          done

          echo "✅ All scans uploaded to Faraday"
          echo "View at: https://manaos.apps.faradaysec.com/#/feed/ws/ekofiesta/host/all/vulns"


  # Phase 2a — FaradAI active pentest against the deployed target.
  # Runs the FaradAI cloud agent (id via FARADAI_AGENT_ID, default 2) through
  # the Faraday REST API. Needs repo variable FARADAI_TARGET (the URL to test).
  faradai-pentest:
    name: FaradAI Pentest (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      FARADAY_URL: ${{ secrets.FARADAY_URL }}
      FARADAY_USER: ${{ secrets.FARADAY_USER }}
      FARADAY_PASSWORD: ${{ secrets.FARADAY_PASSWORD }}
      FARADAI_AGENT_ID: ${{ vars.FARADAI_AGENT_ID || '2' }}
      FARADAI_TARGET: ${{ vars.FARADAI_TARGET }}
      FARADAY_WORKSPACE: ekofiesta
    steps:
      - name: Launch FaradAI pentest
        run: |
          set -euo pipefail
          if [ -z "${FARADAI_TARGET:-}" ]; then
            echo "❌ FARADAI_TARGET repo variable not set — nothing to pentest."
            echo "   Set it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          BASE="${FARADAY_URL%/}"
          # 1) login (cookie session)  2) exchange for an API token
          curl -sS -c /tmp/fcj.txt -X POST "$BASE/_api/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$FARADAY_USER\",\"password\":\"$FARADAY_PASSWORD\"}" >/dev/null
          TOKEN=$(curl -sS -b /tmp/fcj.txt "$BASE/_api/v3/token" | tr -d '"')
          echo "✓ Authenticated with Faraday"
          # 3) launch the FaradAI cloud agent against the target
          curl -sS -X POST "$BASE/_api/v3/cloud_agents/$FARADAI_AGENT_ID/run" \
            -H "Authorization: Token $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "args": {
                "TARGET": "'"$FARADAI_TARGET"'",
                "INSTRUCTION": "Full web/API pentest: auth, IDOR/BOLA, SQLi, injection, XSS, SSRF, mass assignment, JWT. Validate and chain real exploits.",
                "MODE": "Dual",
                "ROUNDS": 40
              },
              "workspaces": ["'"$FARADAY_WORKSPACE"'"]
            }' -w "\nHTTP %{http_code}\n"
          echo "Monitor: $BASE/#/feed/ws/$FARADAY_WORKSPACE/host/all/vulns"

  # Phase 2b — FaradAI triage: review and validate the vulns the pentest left
  # in the workspace (WORKSPACE_CONTEXT=true). Runs after the pentest launch.
  faradai-triage:
    name: FaradAI Triage (Manual)
    runs-on: ubuntu-latest
    needs: [ faradai-pentest ]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      FARADAY_URL: ${{ secrets.FARADAY_URL }}
      FARADAY_USER: ${{ secrets.FARADAY_USER }}
      FARADAY_PASSWORD: ${{ secrets.FARADAY_PASSWORD }}
      FARADAI_AGENT_ID: ${{ vars.FARADAI_AGENT_ID || '2' }}
      FARADAI_TARGET: ${{ vars.FARADAI_TARGET }}
      FARADAY_WORKSPACE: ekofiesta
    steps:
      - name: Launch FaradAI triage
        run: |
          set -euo pipefail
          BASE="${FARADAY_URL%/}"
          curl -sS -c /tmp/fcj.txt -X POST "$BASE/_api/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$FARADAY_USER\",\"password\":\"$FARADAY_PASSWORD\"}" >/dev/null
          TOKEN=$(curl -sS -b /tmp/fcj.txt "$BASE/_api/v3/token" | tr -d '"')
          echo "✓ Authenticated with Faraday"
          curl -sS -X POST "$BASE/_api/v3/cloud_agents/$FARADAI_AGENT_ID/run" \
            -H "Authorization: Token $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "args": {
                "TARGET": "'"${FARADAI_TARGET:-n/a}"'",
                "INSTRUCTION": "Triage the existing findings in this workspace: confirm real vulnerabilities, discard false positives, deduplicate, and assign accurate severity.",
                "MODE": "Dual",
                "ROUNDS": 20,
                "WORKSPACE_CONTEXT": true
              },
              "workspaces": ["'"$FARADAY_WORKSPACE"'"]
            }' -w "\nHTTP %{http_code}\n"
          echo "Monitor: $BASE/#/feed/ws/$FARADAY_WORKSPACE/host/all/vulns"
